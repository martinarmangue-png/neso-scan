<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NESO Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #EEECEA; min-height: 100vh; font-family: 'Inter', sans-serif; }

    /* LOGIN */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .login-card { background: #F7F5F0; border-radius: 28px; border: 0.5px solid #DDD9D0; padding: 40px 36px; width: 320px; }
    .login-logo { font-family: 'Playfair Display', serif; font-size: 22px; color: #0C447C; margin-bottom: 6px; }
    .login-sub { font-size: 11px; color: #B4B2A9; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 32px; }
    .login-label { font-size: 11px; color: #888780; margin-bottom: 6px; letter-spacing: 0.05em; }
    .login-input { width: 100%; background: #EFECE5; border: 0.5px solid #DDD9D0; border-radius: 12px; padding: 14px 16px; font-family: 'Inter', sans-serif; font-size: 14px; color: #1C1C1A; outline: none; margin-bottom: 16px; }
    .login-input:focus { border-color: #0C447C; }
    .login-btn { width: 100%; padding: 15px; border-radius: 14px; background: linear-gradient(135deg, #185FA5, #0A5C48); color: #E1F5EE; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; border: none; cursor: pointer; }
    .login-err { font-size: 11px; color: #C0392B; text-align: center; margin-top: 10px; display: none; }

    /* DASHBOARD */
    .dash { display: none; }
    .topbar { background: #0C447C; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-logo { font-family: 'Playfair Display', serif; font-size: 16px; color: #E6F1FB; letter-spacing: 0.06em; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .date-btn { background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 7px 14px; color: #9FE1CB; font-size: 12px; font-family: 'Inter', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .date-input { background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 7px 14px; color: #E6F1FB; font-size: 12px; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; }
    .logout-btn { background: none; border: none; color: #9FE1CB; font-size: 11px; font-family: 'Inter', sans-serif; cursor: pointer; opacity: 0.7; }
    .logout-btn:hover { opacity: 1; }

    .main { padding: 28px; max-width: 1100px; margin: 0 auto; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: #F7F5F0; border-radius: 18px; border: 0.5px solid #DDD9D0; padding: 20px; }
    .stat-label { font-size: 10px; color: #B4B2A9; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
    .stat-val { font-family: 'Playfair Display', serif; font-size: 32px; color: #0A5C48; font-weight: 500; }
    .stat-sub { font-size: 11px; color: #B4B2A9; margin-top: 2px; }

    .content-grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }

    /* LISTE */
    .list-card { background: #F7F5F0; border-radius: 20px; border: 0.5px solid #DDD9D0; overflow: hidden; }
    .list-header { padding: 18px 20px 14px; border-bottom: 0.5px solid #EAE7E0; }
    .list-title { font-family: 'Playfair Display', serif; font-size: 15px; color: #1C1C1A; }
    .list-body { overflow-y: auto; max-height: 600px; }
    .patient-row { padding: 14px 20px; border-bottom: 0.5px solid #F0EDE6; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 12px; }
    .patient-row:hover { background: #F0EDE6; }
    .patient-row.active { background: #E6F1FB; border-left: 3px solid #0C447C; }
    .patient-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #185FA5, #0A5C48); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 14px; color: #E1F5EE; flex-shrink: 0; }
    .patient-info { flex: 1; min-width: 0; }
    .patient-name { font-size: 13px; font-weight: 500; color: #1C1C1A; margin-bottom: 2px; }
    .patient-meta { font-size: 11px; color: #B4B2A9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patient-score { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 500; flex-shrink: 0; }

    /* FICHE */
    .fiche-card { background: #F7F5F0; border-radius: 20px; border: 0.5px solid #DDD9D0; padding: 28px; }
    .fiche-empty { display: flex; align-items: center; justify-content: center; height: 300px; color: #C4C0B8; font-size: 13px; font-style: italic; }
    .fiche-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
    .fiche-name { font-family: 'Playfair Display', serif; font-size: 26px; color: #1C1C1A; margin-bottom: 4px; }
    .fiche-time { font-size: 11px; color: #B4B2A9; }
    .fiche-score-big { font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 500; line-height: 1; }
    .fiche-score-label { font-size: 10px; color: #B4B2A9; letter-spacing: 0.1em; text-transform: uppercase; text-align: right; margin-top: 2px; }

    .section { margin-bottom: 20px; }
    .section-label { font-size: 10px; color: #B4B2A9; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 12px; border-radius: 10px; background: #EFECE5; border: 0.5px solid #DDD9D0; font-size: 12px; color: #4A4A48; }
    .tag-zone { background: #E6F1FB; border-color: #C4D8EE; color: #185FA5; }
    .divider { height: 0.5px; background: #EAE7E0; margin: 16px 0; }

    .score-bar { height: 6px; border-radius: 3px; background: #EAE7E0; margin-top: 8px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0C447C, #0A5C48); }

    .empty-state { text-align: center; padding: 60px 20px; color: #C4C0B8; }
    .empty-state p { font-size: 13px; margin-top: 8px; }

    .loading { text-align: center; padding: 40px; color: #B4B2A9; font-size: 13px; }

    @media (max-width: 768px) {
      .content-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <p class="login-logo">NESO</p>
    <p class="login-sub">Espace kiné</p>
    <p class="login-label">Mot de passe</p>
    <input class="login-input" type="password" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPwd()" />
    <button class="login-btn" onclick="checkPwd()">Accéder au tableau de bord</button>
    <p class="login-err" id="login-err">Mot de passe incorrect</p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dashboard">
  <div class="topbar">
    <p class="topbar-logo">NESO · Tableau de bord</p>
    <div class="topbar-right">
      <input class="date-input" type="date" id="date-filter" onchange="loadScans()" />
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="main">
    <div class="stats-row">
      <div class="stat-card">
        <p class="stat-label">Patients du jour</p>
        <p class="stat-val" id="stat-count">—</p>
        <p class="stat-sub">scans reçus</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Douleur moyenne</p>
        <p class="stat-val" id="stat-avg">—</p>
        <p class="stat-sub">/ 10</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Zone la plus fréquente</p>
        <p class="stat-val" style="font-size:18px;padding-top:6px;" id="stat-zone">—</p>
        <p class="stat-sub">aujourd'hui</p>
      </div>
    </div>

    <div class="content-grid">
      <div class="list-card">
        <div class="list-header">
          <p class="list-title">Patients</p>
        </div>
        <div class="list-body" id="patient-list">
          <div class="loading">Chargement…</div>
        </div>
      </div>

      <div class="fiche-card" id="fiche-container">
        <div class="fiche-empty">← Sélectionnez un patient</div>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPA_URL = 'https://infjgfupfbylzzuvywpg.supabase.co';
  const SUPA_KEY = 'sb_publishable_1aS8qPPmGm76n0zN_L2uIQ_ArUVtHsF';
  const PASSWORD = 'neso2024';

  let allScans = [];
  let selectedId = null;

  function checkPwd() {
    const v = document.getElementById('pwd-input').value;
    if (v === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      initDate();
      loadScans();
    } else {
      document.getElementById('login-err').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('pwd-input').value = '';
  }

  function initDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date-filter').value = today;
  }

  async function loadScans() {
    const date = document.getElementById('date-filter').value;
    const start = date + 'T00:00:00.000Z';
    const end = date + 'T23:59:59.999Z';

    document.getElementById('patient-list').innerHTML = '<div class="loading">Chargement…</div>';

    const res = await fetch(`${SUPA_URL}/rest/v1/scans?created_at=gte.${start}&created_at=lte.${end}&order=created_at.desc`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` }
    });
    allScans = await res.json();
    renderList();
    renderStats();
  }

  function renderStats() {
    document.getElementById('stat-count').textContent = allScans.length;
    if (allScans.length === 0) {
      document.getElementById('stat-avg').textContent = '—';
      document.getElementById('stat-zone').textContent = '—';
      return;
    }
    const scores = allScans.filter(s => s.score_douleur != null).map(s => s.score_douleur);
    const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '—';
    document.getElementById('stat-avg').textContent = avg;

    const zoneCount = {};
    allScans.forEach(s => (s.zones||[]).forEach(z => { zoneCount[z] = (zoneCount[z]||0)+1; }));
    const topZone = Object.entries(zoneCount).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('stat-zone').textContent = topZone ? topZone[0] : '—';
  }

  function renderList() {
    const el = document.getElementById('patient-list');
    if (!allScans.length) {
      el.innerHTML = '<div class="empty-state"><p>Aucun scan reçu pour cette date.</p></div>';
      return;
    }
    el.innerHTML = allScans.map(s => {
      const score = s.score_douleur ?? '?';
      const color = score >= 7 ? '#C0392B' : score >= 4 ? '#E67E22' : '#0A5C48';
      const zones = (s.zones||[]).join(', ') || 'Non renseigné';
      const time = s.created_at ? new Date(s.created_at).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}) : '';
      const initial = (s.prenom||'?')[0].toUpperCase();
      return `<div class="patient-row ${selectedId===s.id?'active':''}" onclick="selectPatient('${s.id}')">
        <div class="patient-avatar">${initial}</div>
        <div class="patient-info">
          <p class="patient-name">${s.prenom || 'Anonyme'}</p>
          <p class="patient-meta">${zones} · ${time}</p>
        </div>
        <span class="patient-score" style="color:${color}">${score}</span>
      </div>`;
    }).join('');
  }

  function selectPatient(id) {
    selectedId = id;
    renderList();
    const s = allScans.find(x => x.id === id);
    if (!s) return;

    const score = s.score_douleur ?? '?';
    const color = score >= 7 ? '#C0392B' : score >= 4 ? '#E67E22' : '#0A5C48';
    const time = s.created_at ? new Date(s.created_at).toLocaleString('fr-FR', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}) : '';

    document.getElementById('fiche-container').innerHTML = `
      <div class="fiche-header">
        <div>
          <p class="fiche-name">${s.prenom || 'Anonyme'}</p>
          <p class="fiche-time">Scan reçu le ${time}</p>
        </div>
        <div style="text-align:right;">
          <p class="fiche-score-big" style="color:${color}">${score}</p>
          <p class="fiche-score-label">/ 10</p>
        </div>
      </div>
      <div class="score-bar"><div class="score-fill" style="width:${(score/10*100)||0}%"></div></div>
      <div class="divider"></div>

      <div class="section">
        <p class="section-label">Zones concernées</p>
        <div class="tags">${tags(s.zones, 'tag-zone')}</div>
      </div>
      <div class="divider"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="section">
          <p class="section-label">Depuis quand</p>
          <div class="tags">${tags([s.douleur_depuis])}</div>
        </div>
        <div class="section">
          <p class="section-label">Évolution</p>
          <div class="tags">${tags([s.evolution])}</div>
        </div>
      </div>
      <div class="divider"></div>

      <div class="section">
        <p class="section-label">Type de douleur</p>
        <div class="tags">${tags(s.type_douleur)}</div>
      </div>
      <div class="divider"></div>

      <div class="section">
        <p class="section-label">Ce qui gêne le plus</p>
        <div class="tags">${tags(s.gene)}</div>
      </div>
      <div class="divider"></div>

      <div class="section">
        <p class="section-label">Objectif du patient</p>
        <div class="tags">${tags([s.objectif])}</div>
      </div>
    `;
  }

  function tags(arr, cls='') {
    if (!arr || !arr.length || (arr.length===1 && !arr[0])) return '<span style="font-size:12px;color:#C4C0B8;font-style:italic;">Non renseigné</span>';
    return arr.filter(Boolean).map(t => `<span class="tag ${cls}">${t}</span>`).join('');
  }
</script>
</body>
</html>
