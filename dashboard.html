<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Physio Scan · Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#EEECEA; color:#1C1C1A; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:28px 16px; }
    .wrap { max-width:980px; margin:0 auto; }
    .top { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; }
    h1 { font-family:Georgia,serif; color:#0C447C; font-weight:500; letter-spacing:.03em; }
    .sub { color:#888780; font-size:14px; margin-top:4px; }
    .card { background:#F7F5F0; border:.5px solid #DDD9D0; border-radius:24px; padding:20px; box-shadow:0 18px 50px rgba(12,68,124,.08); margin-bottom:18px; }
    input { width:100%; padding:13px 14px; border-radius:14px; border:.5px solid #DDD9D0; background:#F0EDE6; outline:none; margin-bottom:10px; }
    button { border:none; border-radius:14px; padding:13px 18px; cursor:pointer; background:linear-gradient(135deg,#185FA5,#0A5C48); color:#E1F5EE; font-weight:600; }
    .ghost { background:transparent; color:#888780; padding:8px 0; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
    .stat { background:#F7F5F0; border:.5px solid #DDD9D0; border-radius:18px; padding:16px; }
    .stat b { display:block; font-size:26px; color:#0A5C48; font-family:Georgia,serif; }
    .stat span { color:#888780; font-size:12px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:#A8A49C; padding:0 0 10px; }
    td { padding:12px 0; border-top:.5px solid #EAE7E0; font-size:14px; vertical-align:top; }
    .pill { display:inline-block; padding:4px 9px; border-radius:8px; background:#EFECE5; border:.5px solid #DDD9D0; font-size:12px; margin:2px; }
    .score { font-family:Georgia,serif; color:#0A5C48; font-size:22px; }
    .hidden { display:none; }
    .detail { margin-top:12px; padding-top:12px; border-top:.5px solid #EAE7E0; color:#4A4A48; line-height:1.8; }
    .err { color:#9D3D31; font-size:13px; margin-top:8px; }
    @media (max-width:760px) {
      .grid { grid-template-columns:repeat(2,1fr); }
      table, thead, tbody, th, td, tr { display:block; }
      th { display:none; }
      td { border:none; padding:4px 0; }
      tr { border-top:.5px solid #EAE7E0; padding:12px 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Physio Scan</h1>
        <p class="sub">Dashboard praticien — scans patients</p>
      </div>
      <button class="ghost hidden" id="logout" onclick="logout()">Déconnexion</button>
    </div>

    <div class="card" id="login">
      <h2 style="font-family:Georgia,serif;font-weight:500;margin-bottom:14px;">Connexion</h2>
      <input id="email" type="email" placeholder="Email praticien"/>
      <input id="password" type="password" placeholder="Mot de passe"/>
      <button onclick="login()">Se connecter</button>
      <p class="err" id="login-error"></p>
    </div>

    <div id="app" class="hidden">
      <div class="grid">
        <div class="stat">
          <div class="kpi-value" id="kpiToday">0</div>
          <div class="kpi-caption" id="kpiTotal">0 scan au total</div>
        </div>
        <div class="stat">
          <div class="kpi-value" id="kpiCompletion">100%</div>
          <div class="kpi-caption">scans terminés / scans reçus</div>
        </div>
        <div class="stat">
          <div class="kpi-value" id="kpiAverageTime">-</div>
          <div class="kpi-caption">temps moyen estimé</div>
        </div>
        <div class="stat">
          <div class="kpi-value" id="kpiAbandon">0%</div>
          <div class="kpi-caption">tracking avancé à venir</div>
        </div>
      </div>

      <div class="card">
        <input class="search" id="searchInput" placeholder="Rechercher un patient, une zone..." oninput="renderScans()" />
        <aside>
          <div class="scan-list" id="scanList">
            <div style="padding:24px;color:var(--muted);font-size:14px;">Chargement des scans Supabase...</div>
          </div>
        </aside>
      </div>
    </div>
  </div>

<script>
    const SUPABASE_URL = "https://TON-PROJET.supabase.co";
    const SUPABASE_ANON_KEY = "TON-ANON-KEY";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let scans = [];
    let activeFilter = 'all';
    let activeScanIndex = 0;

    async function loadScans() {
      const { data, error } = await sb
        .from('scans')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('scanList').innerHTML = `
          <div style="padding:24px;color:#9D3D31;font-size:14px;line-height:1.6;">
            Impossible de charger les scans Supabase.<br>
            ${esc(error.message)}
          </div>
        `;
        return;
      }

      scans = data || [];
      renderScans();
      renderKpis();
      renderAnalytics();

      if (scans.length > 0) {
        selectScan(0);
      }
    }

    function filterScans(filter, button) {
      activeFilter = filter;

      document.querySelectorAll('.filter-chip').forEach(function(chip) {
        chip.classList.remove('active-filter');
      });
      button.classList.add('active-filter');

      renderScans();
    }

    function getFilteredScans() {
      const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);

      return scans.filter(function(scan) {
        const completed = isCompleted(scan);
        const createdAt = new Date(scan.created_at);
        const isToday = createdAt >= todayStart;

        const matchesFilter =
          activeFilter === 'all' ||
          (activeFilter === 'completed' && completed) ||
          (activeFilter === 'abandoned' && !completed) ||
          (activeFilter === 'today' && isToday);

        const searchable = [
          scan.prenom,
          scan.objectif,
          scan.duree,
          scan.evolution,
          arrayText(scan.zones),
          arrayText(scan.type_douleur),
          arrayText(scan.gene)
        ].join(' ').toLowerCase();

        const matchesSearch = !query || searchable.includes(query);
        return matchesFilter && matchesSearch;
      });
    }

    function renderScans() {
      const list = document.getElementById('scanList');
      const filtered = getFilteredScans();

      if (!filtered.length) {
        list.innerHTML = `<div style="padding:24px;color:var(--muted);font-size:14px;">Aucun scan à afficher avec ce filtre.</div>`;
        return;
      }

      list.innerHTML = filtered.map(function(scan) {
        const realIndex = scans.indexOf(scan);
        const name = scan.prenom || 'Patient';
        const zone = firstValue(scan.zones, 'Zone non renseignée');
        const pain = scan.score_douleur ?? '-';
        const completed = isCompleted(scan);

        return `
          <div class="scan-row ${realIndex === activeScanIndex ? 'active' : ''}" onclick="selectScan(${realIndex})">
            <div class="avatar">${esc(name.charAt(0).toUpperCase())}</div>
            <div>
              <div class="scan-name">${esc(name)}</div>
              <div class="scan-meta">${esc(zone)} · ${fmtDate(scan.created_at)}<br />${completed ? 'Scan complété' : 'Scan incomplet'}</div>
            </div>
            <div class="scan-side">
              <div class="pain">${esc(pain)}</div>
              <div class="status ${completed ? 'completed' : 'abandoned'}">${completed ? 'Complété' : 'Abandon'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectScan(index) {
      activeScanIndex = index;
      const scan = scans[index];
      if (!scan) return;

      renderScans();

      const pain = Number(scan.score_douleur);
      const safePain = Number.isFinite(pain) ? pain : 0;

      document.getElementById('patientName').textContent = scan.prenom || 'Patient';
      document.getElementById('patientDate').textContent = `Scan reçu le ${fmtFullDate(scan.created_at)}`;
      document.getElementById('patientPain').textContent = scan.score_douleur ?? '-';
      document.getElementById('patientZone').textContent = arrayText(scan.zones) || '-';
      document.getElementById('patientSince').textContent = scan.duree || '-';
      document.getElementById('patientEvolution').textContent = scan.evolution || '-';
      document.getElementById('patientProblem').textContent = arrayText(scan.gene) || '-';
      document.getElementById('patientType').textContent = arrayText(scan.type_douleur) || '-';
      document.getElementById('patientGoal').textContent = scan.objectif || '-';
      document.getElementById('painBar').style.width = Math.min(Math.max(safePain * 10, 0), 100) + '%';
    }

    function renderKpis() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayCount = scans.filter(scan => new Date(scan.created_at) >= todayStart).length;
      const completedCount = scans.filter(isCompleted).length;
      const completionRate = scans.length ? Math.round((completedCount / scans.length) * 100) : 0;
      const abandonRate = scans.length ? 100 - completionRate : 0;

      document.getElementById('kpiToday').textContent = todayCount;
      document.getElementById('kpiTotal').textContent = scans.length + ' scans au total';
      document.getElementById('kpiCompletion').textContent = completionRate + '%';
      document.getElementById('kpiAbandon').textContent = abandonRate + '%';
      document.getElementById('kpiAverageTime').textContent = '-';
    }

    function renderAnalytics() {
      renderStatBlock(0, 'Réponses · zones douloureuses', countArrayAnswers('zones'));
      renderStatBlock(1, 'Réponses · gêne principale', countArrayAnswers('gene'));
      renderStatBlock(2, 'Réponses · ancienneté', countTextAnswers('duree'));
    }

    function renderStatBlock(blockIndex, title, stats) {
      const blocks = document.querySelectorAll('.analytics-block');
      const block = blocks[blockIndex];
      if (!block) return;

      const topStats = stats.slice(0, 3);
      const max = topStats[0]?.count || 1;

      block.classList.remove('problem');
      block.innerHTML = `
        <div class="analytics-title">${esc(title)}</div>
        ${topStats.length ? topStats.map(function(item) {
          const percent = scans.length ? Math.round((item.count / scans.length) * 100) : 0;
          const width = Math.max(Math.round((item.count / max) * 100), 8);
          return `
            <div class="stat-line">
              <div class="stat-top"><span>${esc(item.label)}</span><strong>${percent}%</strong></div>
              <div class="mini-bar"><div class="mini-fill" style="width: ${width}%"></div></div>
            </div>
          `;
        }).join('') : '<div style="color:var(--muted);font-size:14px;">Pas encore assez de données.</div>'}
      `;
    }

    function countArrayAnswers(field) {
      const counts = {};
      scans.forEach(function(scan) {
        const values = Array.isArray(scan[field]) ? scan[field] : [];
        values.forEach(function(value) {
          if (!value) return;
          counts[value] = (counts[value] || 0) + 1;
        });
      });
      return sortCounts(counts);
    }

    function countTextAnswers(field) {
      const counts = {};
      scans.forEach(function(scan) {
        const value = scan[field];
        if (!value) return;
        counts[value] = (counts[value] || 0) + 1;
      });
      return sortCounts(counts);
    }

    function sortCounts(counts) {
      return Object.entries(counts)
        .map(([label, count]) => ({ label, count }))
        .sort((a, b) => b.count - a.count);
    }

    function isCompleted(scan) {
      return Boolean(scan.objectif || scan.score_douleur || scan.zones?.length);
    }

    function firstValue(value, fallback) {
      if (Array.isArray(value) && value.length) return value[0];
      if (value) return value;
      return fallback;
    }

    function arrayText(value) {
      if (Array.isArray(value)) return value.join(', ');
      return value || '';
    }

    function fmtDate(date) {
      if (!date) return '-';
      return new Date(date).toLocaleString('fr-FR', {
        day: '2-digit',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      }).replace('.', '');
    }

    function fmtFullDate(date) {
      if (!date) return '-';
      return new Date(date).toLocaleString('fr-FR', {
        day: '2-digit',
        month: 'long',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(char) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[char];
      });
    }

    loadScans();
  </script>
</body>
</html>
